name: Synthetic sudo contract
on:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ci/synthetic_sudo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Local construction and state-machine checks
        run: python3 -B test_contract.py --local
      - name: Real ordinary-user to sudo checks
        run: python3 -B test_contract.py --sudo
